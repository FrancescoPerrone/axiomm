name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev tooling
        run: python -m pip install -e ".[dev]"
      - name: ruff check
        run: ruff check .

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Common pip-reliable scientific runtime: exercises the h5py reader,
      # scikit-learn (PCA/GMM/HDBSCAN) and matplotlib paths on every
      # supported Python. hyperspy / umap / xraylib are covered by the
      # dependency-rich job below.
      - name: Install package + pip-reliable extras
        run: python -m pip install -e ".[dev,hdf5,analysis,viz]"
      - name: pytest
        run: pytest

  test-scientific:
    name: Tests (dependency-rich, py3.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      # xraylib is only reliably available from conda-forge, so the quant
      # (Cliff-Lorimer k-factor) tests need a conda env rather than pip.
      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.11"
          channels: conda-forge
          auto-activate-base: false
          activate-environment: axiomm-ci
      - name: Install xraylib (conda-forge)
        run: conda install -y -c conda-forge xraylib
      # Everything else via pip so the optional scientific paths — HyperSpy
      # signal builder + .bcf reader, UMAP, matplotlib — are all exercised
      # rather than skipped. (vtk is deliberately excluded: heavy, desktop-only.)
      - name: Install package + scientific extras
        run: python -m pip install -e ".[dev,all,umap]"
      - name: pytest (full, optional paths exercised)
        run: pytest
