[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "axiomm"
version = "0.1.0.dev0"
description = "AXIOMM (Automated X-ray Intelligence for Organising Mineral Mapping): a Python package for spectroscopy."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Francesco Perrone" },
]
keywords = [
    "spectroscopy",
    "x-ray",
    "mineral-mapping",
    "mineralogy",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
hdf5 = ["h5py>=3.8"]
hyperspy = ["hyperspy>=2.0"]
analysis = ["scikit-learn>=1.3"]
umap = ["umap-learn>=0.5"]
quant = ["xraylib"]
viz = ["matplotlib>=3.7"]
vtk = ["vtk>=9.1"]
all = ["h5py>=3.8", "hyperspy>=2.0", "scikit-learn>=1.3", "matplotlib>=3.7"]
notebook = ["ipywidgets", "jupyter"]
dev = [
    "pytest>=7",
    "pytest-cov",
    "ruff==0.16.8",   # pinned so lint is reproducible across machines and CI
]
docs = [
    "sphinx>=7",
    "furo>=2024",
    "myst-parser>=2",
    "sphinx-autoapi>=3",
    "sphinx-copybutton",
]

# The CLI entry point will be wired up in a later chunk, once
# axiomm.io.converters.ux.cli exists.
# [project.scripts]
# axiomm-convert = "axiomm.io.converters.ux.cli:main"

[project.urls]
Homepage = "https://github.com/FrancescoPerrone/axiomm"
Source = "https://github.com/FrancescoPerrone/axiomm"
Issues = "https://github.com/FrancescoPerrone/axiomm/issues"
Documentation = "https://github.com/FrancescoPerrone/axiomm/wiki"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers -m 'not realdata'"
markers = [
    "realdata: opt-in tests that require network access and/or a large real dataset cache (deselected by default; run with `pytest -m realdata`)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# The legacy prototype is preserved reference material only (spec §18); it is
# not part of the package and is intentionally frozen, so it is not linted.
extend-exclude = ["docs/specs/_legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # line length handled by formatter

# Scientific text uses these characters intentionally (µm, A×B ranges, en-dash
# numeric ranges, Greek line/phase symbols); keep the homoglyph check on for
# anything unexpected but allow the ones this domain actually needs.
allowed-confusables = ["×", "–", "µ", "α", "β", "γ", "λ", "Å"]

[tool.ruff.lint.per-file-ignores]
# Tests guard optional-dependency modules with importorskip at module top and
# then import (E402); assert broad raises and use bare-attribute access to
# trigger validation (B017/B018); hold mutable defaults in throwaway helper
# classes (RUF012); and pass plain unescaped substrings to raises(match=)
# (RUF043). These are intentional test idioms, not defects.
"tests/**" = ["E402", "B017", "B018", "RUF012", "RUF043"]
# __all__ here is grouped by tool/topic on purpose, not alphabetical.
"src/axiomm/io/converters/__init__.py" = ["RUF022"]
